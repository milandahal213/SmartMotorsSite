# _data/steps.yml
# Text for the "How It Works" animation on the home page (one entry per step).

step1_description: >-
  Plug a sensor into the sensor port, or leave it empty to use the built-in accelerometer. Then switch the Smart Motor on.

step2_description: >-
  Teach it by example. Set the sensor, turn the knob to put the motor where you want it, then press the button to save that pair. Each saved pair becomes a dot on the screen.

step3_description: >-
  In Play mode the motor watches the sensor and moves to the position you saved for the closest reading.

step4_description: >-
  Now build something and have fun! Here the hub swings a door: when a hand comes close to the distance sensor, the door opens.
